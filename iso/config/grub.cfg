set timeout=5
set default=0

insmod all_video
insmod gfxterm

# gfxterm draws text from a .pf2 font, and GRUB's built-in font covers ASCII
# only. Without a real font loaded, every non-ASCII character in the menu --
# the box-drawing frame and the up/down arrows in the help line -- comes out as
# GRUB's missing-glyph placeholder, a small box with a question mark in it. At
# native size on a real screen that reads as a stray "@", which is exactly how
# this was reported from a physical boot.
#
# The font needs no help from build-iso.sh: grub-mkstandalone embeds
# unicode.pf2 at this path on its own (--fonts=FONTS [default=unicode]), so it
# has shipped on every ISO built so far and merely went unloaded.
#
# $prefix, not $root: the font lives in the memdisk grub-mkstandalone builds
# around this config, and the `search` below repoints $root at the installation
# medium. loadfont runs before that, so $prefix is the only reliable way to
# name the memdisk.
if loadfont $prefix/fonts/unicode.pf2; then
    terminal_output gfxterm
else
    # Text mode takes its frame glyphs from the firmware's own font, which has
    # them. Plainer than gfxterm, but never wrong-looking -- a better failure
    # than silently going back to placeholder boxes.
    terminal_output console
fi

# grub-mkstandalone embeds this config in a memdisk, and $root points at that
# memdisk -- not at the installation medium -- so /live/* would not be found.
# Search by a file the medium carries rather than by volume label: it works
# identically for an El Torito CD boot and for the isohybrid image written to
# a USB stick, and it does not depend on the volid surviving verbatim.
search --no-floppy --set=root --file /live/vmlinuz

menuentry "Install ik-os" {
    linux  /live/vmlinuz boot=live components quiet splash ik-os.install=auto
    initrd /live/initrd.img
}

menuentry "Install ik-os (verbose)" {
    linux  /live/vmlinuz boot=live components ik-os.install=auto
    initrd /live/initrd.img
}

menuentry "Live shell (no install)" {
    linux  /live/vmlinuz boot=live components
    initrd /live/initrd.img
}
