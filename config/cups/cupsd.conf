# ik-os CUPS policy (SDD §52).
# Remote administration is off and queues are not shared to the LAN.

LogLevel warn
MaxLogSize 0
PageLogFormat

# Listen on the loopback and the local domain socket only.
Listen localhost:631
Listen /run/cups/cups.sock

# SDD §52 — do not expose printer queues to the LAN by default.
Browsing Off
BrowseLocalProtocols none

DefaultAuthType Basic
WebInterface Yes

# @SYSTEM below resolves to this. Debian compiles in "lpadmin" as the default,
# but every "Require user @SYSTEM" rule in this file depends on it, so state it
# rather than inheriting it from a build flag.
SystemGroup lpadmin

<Location />
  Order allow,deny
</Location>

# SDD §52 — administration requires authorisation, from the local machine only.
<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
