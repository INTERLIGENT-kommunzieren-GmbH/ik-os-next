# Open the firewall for SSH only while sshd is actually running (ADR 0023).
#
# Installed as a drop-in on ssh.service. Without it, switching "Remote Login"
# on in GNOME Settings starts sshd and nothing can reach it: the ik-os
# firewalld zone does not open 22, so the toggle looks like it worked and the
# machine stays unreachable. That is a worse failure than the port being
# closed, because it is silent.
#
# Runtime only -- no --permanent. The rule lives exactly as long as the service
# does: enable Remote Login and the port opens, switch it off and it closes,
# reboot without enabling it and nothing was ever written. This is what keeps
# SDD §50's "avoid unnecessary listening network ports" true on a machine where
# the port CAN be opened: the default is still closed, and open is a state
# someone chose.
#
# ExecStartPost failing must not fail sshd, hence the leading "-": on a machine
# where firewalld is stopped there is no firewall to open, and refusing to
# start sshd for that would be absurd.
[Service]
ExecStartPost=-/usr/bin/firewall-cmd --zone=ik-os --add-service=ssh
ExecStopPost=-/usr/bin/firewall-cmd --zone=ik-os --remove-service=ssh
