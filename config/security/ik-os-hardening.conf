# SDD §50 — workstation security baseline. Deliberately conservative: this is a
# developer machine and must not break normal development workflows.

kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 1

net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Unprivileged ICMP sockets, so `ping` works for users. Debian's ping carries no
# file capability and relies on this; systemd used to set it in 50-default.conf,
# which now lives in linux-sysctl-defaults, a Recommends we do not install.
net.ipv4.ping_group_range = 0 2147483647

# Docker and rootless containers need these; do not tighten without testing
# `docker run` and `podman run` first (SDD §51).
# user.max_user_namespaces stays at the Debian default.
