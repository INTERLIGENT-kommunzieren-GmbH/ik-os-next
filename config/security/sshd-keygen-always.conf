# Generate sshd host keys whenever they are missing, not only on first boot.
#
# Installed as a drop-in on Debian's sshd-keygen.service, which is already
# wired to every way sshd can start (WantedBy=ssh.service sshd.service
# sshd@.service ssh.socket) but carries:
#
#     ConditionFirstBoot=yes
#
# On this image that condition is never true when it matters. SSH ships
# disabled (ADR 0023), so nothing pulls this unit in on the one boot where the
# condition holds; by the time someone switches Remote Login on -- next week,
# next month -- ConditionFirstBoot is no, the unit is skipped, and sshd fails
# its own `sshd -t` for want of a host key. Clearing the condition makes it run
# whenever sshd is about to start. ssh-keygen -A only creates what is missing,
# so on every later start it is a no-op.
[Unit]
ConditionFirstBoot=
