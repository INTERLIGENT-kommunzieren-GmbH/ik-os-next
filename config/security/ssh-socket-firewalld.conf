# The socket-activated path needs the same firewall handling as ssh.service.
#
# Installed as a drop-in on ssh.socket. Our preset disables this unit and both
# `ik-os ssh enable` and GNOME's Remote Login switch drive ssh.service, but
# "probably nothing uses this" is not a reason to leave a hole: if anything
# ever enables ssh.socket, sshd would listen behind a closed firewall and look
# like it worked. Runtime only, exactly as for the service.
[Socket]
ExecStartPost=-/usr/bin/firewall-cmd --zone=ik-os --add-service=ssh
ExecStopPost=-/usr/bin/firewall-cmd --zone=ik-os --remove-service=ssh
