# ik-os initramfs policy (SDD §4, §5)
hostonly="no"
compress="zstd"
reproducible="yes"
# The `bootc` module is installed by bootc itself (built from source); `ostree`
# comes from the Debian ostree package. Both are requested so the initramfs is
# correct regardless of which one the pinned bootc version ships.
add_dracutmodules+=" bootc ostree systemd systemd-initrd dm rootfs-block "
filesystems+=" btrfs ext4 vfat overlay "
# Framework storage/graphics/thunderbolt enablement (SDD §2).
add_drivers+=" nvme xhci_pci thunderbolt i915 xe amdgpu "
