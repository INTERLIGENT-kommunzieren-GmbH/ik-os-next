# ik-os initramfs policy (SDD §4, §5)
hostonly="no"
compress="zstd"
reproducible="yes"
# The `bootc` module is installed by bootc itself (built from source); `ostree`
# comes from the Debian ostree package. Both are requested so the initramfs is
# correct regardless of which one the pinned bootc version ships.
# crypt + systemd-cryptsetup unlock the LUKS root the installer creates, and
# plymouth renders the passphrase prompt with the ik branding instead of a bare
# text line (ADR 0022). All three modules ship in the image already: 70crypt,
# 71systemd-cryptsetup and 45plymouth under /usr/lib/dracut/modules.d.
#
# Both crypt and systemd-cryptsetup are requested on purpose. systemd is in
# this initramfs, so systemd-cryptsetup's generator is what actually honours
# rd.luks.uuid=; crypt carries the cryptsetup binary and the udev rules it
# needs, and is what a systemd-less fallback path would use.
add_dracutmodules+=" bootc ostree systemd systemd-initrd dm rootfs-block crypt systemd-cryptsetup plymouth "
filesystems+=" btrfs ext4 vfat overlay "
# Framework storage/graphics/thunderbolt enablement (SDD §2).
add_drivers+=" nvme xhci_pci thunderbolt i915 xe amdgpu "
