// The dpkg/apt state ends up in /usr on the deployed system, reached through
// the tmpfiles symlinks written by build/scripts/95-finalize.sh. apt therefore
// keeps its default paths and needs no override here.
Dir::Cache "/var/cache/apt";

APT::Install-Recommends "false";
APT::Install-Suggests "false";
APT::Get::Assume-Yes "true";
Acquire::Languages "none";
