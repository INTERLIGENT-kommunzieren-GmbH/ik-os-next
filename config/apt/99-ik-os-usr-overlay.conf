// ADR 0024 — plain apt on a booted host explains itself instead of failing
// obscurely; `ik-os pkg` holds the lock the guard looks for. Container builds
// are exempt (see the script).
//
// dpkg itself is guarded by config/dpkg/ik-os-usr-overlay. These run earlier,
// before apt resolves anything: plain apt keeps its lists apart from the
// overlay's, so without them `apt install` stops at "Unable to locate package"
// and the user never learns why. AptCli hooks cover apt and apt-get alike.
APT::Update::Pre-Invoke { "/usr/libexec/ik-os/ik-os-apt-guard update"; };
AptCli::Hooks::Install { "/usr/libexec/ik-os/ik-os-apt-guard install"; };
AptCli::Hooks::Upgrade { "/usr/libexec/ik-os/ik-os-apt-guard upgrade"; };
AptCli::Hooks::Search { "/usr/libexec/ik-os/ik-os-apt-guard search"; };
