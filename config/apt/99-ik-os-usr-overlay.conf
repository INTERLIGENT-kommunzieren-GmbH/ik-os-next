// ADR 0024 — refuse plain apt on a booted host; `ik-os pkg` holds the lock the
// guard looks for. Container builds are exempt (see the script).
//
// dpkg itself is guarded by config/dpkg/ik-os-usr-overlay, which also covers
// apt installs. This hook exists for `apt update`: plain apt keeps its lists
// apart from the overlay's, so without it `apt install` fails with "Unable to
// locate package" and the user never sees why.
APT::Update::Pre-Invoke { "/usr/libexec/ik-os/ik-os-apt-guard"; };
