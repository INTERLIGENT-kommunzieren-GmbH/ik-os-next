# Build-time dpkg policy.
#
# NOTE: admindir is deliberately NOT set here. The dpkg database is relocated
# into /usr at the very end of the build (build/scripts/95-finalize.sh) and
# symlinked back from /var via tmpfiles, so dpkg uses its normal /var/lib/dpkg
# path throughout the build. Pointing admindir at /usr/lib/dpkg up front makes
# dpkg read an empty database and every pre-dependency fails.
path-exclude=/usr/share/doc/*
path-exclude=/usr/share/man/*
path-include=/usr/share/doc/*/copyright
