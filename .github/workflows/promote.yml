---
name: Promote testing to stable

# SDD §8 — a release only reaches stable after validation, and the previous
# stable image must remain available for rollback.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to promote (e.g. testing.20260823.42)"
        required: true
      hardware-validation-ticket:
        description: "Ticket recording hardware validation (SDD §9)"
        required: true
      acknowledge-unsigned-bootloader:
        description: "Promote an image that cannot Secure Boot (SDD §5) — type: yes"
        required: false
        default: "no"

env:
  IMAGE_NAME: ik-os-next
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-24.04
    environment: stable     # requires a reviewer approval in repo settings
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # Same credential choice as build.yml. GITHUB_TOKEN suffices because the
      # package grants this repository Actions access (docs/releases.md);
      # GHCR_TOKEN stays supported so a lost grant can be worked around without
      # editing a workflow, and the log says which one ran.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          if [[ -n "$GHCR_TOKEN" ]]; then
            echo "authenticating with GHCR_TOKEN (PAT)"
            token="$GHCR_TOKEN"
          else
            echo "authenticating with GITHUB_TOKEN (no PAT configured)"
            token="$GITHUB_TOKEN"
          fi
          # Same shared credential file as build.yml, and for the same reason:
          # skopeo reads REGISTRY_AUTH_FILE, cosign reads $DOCKER_CONFIG. The
          # `cosign verify` below happens to work anonymously while the package
          # is public, so this is a latent failure rather than a current one —
          # fixed here so making the package private is not a surprise.
          auth="${RUNNER_TEMP}/docker"
          mkdir -p "$auth"
          echo "DOCKER_CONFIG=${auth}"                  >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=${auth}/config.json" >> "$GITHUB_ENV"

          printf '%s' "$token" \
            | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin \
                --authfile "${auth}/config.json"

      - name: Verify the candidate is signed (SDD §45)
        run: |
          curl -sSfL -o cosign.pub https://raw.githubusercontent.com/${{ github.repository }}/main/config/company/cosign.pub
          cosign verify --key cosign.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.version }}"

      # SDD §5, ADR 0002 — stable is what the fleet runs, so it must Secure Boot.
      # build.yml labels every image with the state it built, and verify-image.sh
      # fails inside that build if `required` did not produce a signed binary, so
      # a label of "yes" on an image that exists means the bootloader is signed.
      # Reading the label costs one registry request; reading the file inside the
      # image would cost a seven-gigabyte pull.
      - name: The candidate must Secure Boot (Rule 18)
        run: |
          REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.version }}"
          sb=$(skopeo inspect "docker://${REF}" \
                 | jq -r '.Labels["com.interligent.ik-os.secureboot"] // "unset"')
          echo "com.interligent.ik-os.secureboot = ${sb}"

          if [[ "$sb" == yes ]]; then
            echo "the candidate has a signed bootloader"
            exit 0
          fi

          # "unset" means the image predates the label, which in practice means it
          # was built while the signing guard was unreachable — so it is unsigned,
          # not unknown. It is reported separately anyway, because the two want
          # different fixes: rebuild versus configure the MOK.
          if [[ "$sb" == unset ]]; then
            echo "::warning::This image carries no Secure Boot label, so it was built before the signing guard existed (before 2026-08-31) and its bootloader is unsigned."
          fi

          if [[ "${{ inputs.acknowledge-unsigned-bootloader }}" == "yes" ]]; then
            echo "::warning title=Promoting an unsigned bootloader::Acknowledged by ${{ github.actor }}. Every machine on stable will need Secure Boot disabled, which violates SDD §50. Ticket: ${{ inputs.hardware-validation-ticket }}"
            exit 0
          fi

          echo "::error title=Candidate cannot Secure Boot::${REF} has an unsigned bootloader (label: ${sb}). Rule 18: refusing to make it stable."
          echo "Commit config/company/ik-os-mok.crt and set the SECURE_BOOT_MOK_KEY"
          echo "secret, rebuild, and promote the new version. To override"
          echo "deliberately, re-run this workflow with"
          echo "acknowledge-unsigned-bootloader = yes."
          exit 1

      - name: Keep the outgoing stable image available for rollback
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          PREV=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:stable" || true)
          if [[ -n "$PREV" ]]; then
            skopeo copy "docker://${IMAGE}@${PREV}" "docker://${IMAGE}:stable-previous"
            echo "previous stable preserved as :stable-previous (${PREV})"
          fi

      - name: Promote
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          skopeo copy --all \
            "docker://${IMAGE}:${{ inputs.version }}" \
            "docker://${IMAGE}:stable"
          echo "promoted ${{ inputs.version }} -> stable"
          echo "hardware validation: ${{ inputs.hardware-validation-ticket }}"
