---
name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [testing, stable]
        default: testing
  release:
    types: [published]

env:
  IMAGE_NAME: ik-os-next
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CHANNEL: ${{ inputs.channel || 'stable' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: UEFI live installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Pull the ik-os image
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          podman pull "${IMAGE_REGISTRY,,}/${IMAGE_NAME}:${CHANNEL}"

      - name: Export the payload
        run: |
          mkdir -p output
          podman save --format oci-archive -o output/ik-os-payload.oci \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${CHANNEL}"
          ls -lh output/

      - name: Build the ISO builder
        run: podman build -t ik-os-iso-builder -f iso/Containerfile.builder iso

      - name: Build the ISO
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD/output:/output" \
            -v "$PWD/iso:/iso:ro" \
            -e PAYLOAD=/output/ik-os-payload.oci \
            -e "TARGET_REF=${IMAGE_REGISTRY}/${IMAGE_NAME}:${CHANNEL}" \
            ik-os-iso-builder /iso/build-iso.sh
          sudo chown -R "$USER:$USER" output
          rm -f output/ik-os-payload.oci
          ls -lh output/

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: ik-os-installer-${{ env.CHANNEL }}
          path: output/*.iso*
          if-no-files-found: error
          compression-level: 0

      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" output/*.iso output/*.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
