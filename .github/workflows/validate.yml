---
name: Validate
# SDD §44 — the cheap checks run first so a typo fails in seconds, not after a
# 40-minute image build.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          mapfile -t files < <(
              # config/network holds the NetworkManager dispatcher hook, whose
              # filename NM dictates (50-ik-os-lansweeper) -- it matches neither
              # *.sh nor ik-os-*, so it needs its own clause or it is never linted.
              find build scripts migration iso tests config/network -type f \
                   \( -name '*.sh' -o -name 'ik-os' -o -name 'ik-os-*' \
                      -o -name '[0-9][0-9]-ik-os-*' \) \
                   ! -name '*.service' | sort
          )
          (( ${#files[@]} )) || { echo "::error::no scripts found"; exit 1; }
          printf '  %s\n' "${files[@]}"
          shellcheck -x -S warning "${files[@]}"
          echo "shellcheck clean (${#files[@]} files)"

  packages:
    name: Package lists
    runs-on: ubuntu-24.04
    container: docker.io/library/debian:forky
    steps:
      - uses: actions/checkout@v5
      - name: Validate package lists against the Debian archive
        run: REPO="$GITHUB_WORKSPACE" bash build/validation/check-packages.sh

  brewfile:
    name: Brewfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate the Brewfile against homebrew/core and declared taps
        # Homebrew only runs on first boot, so a wrong entry here is not caught
        # by the image build — it fails on every laptop instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: REPO="$GITHUB_WORKSPACE" bash build/validation/check-brewfile.sh

  flatpaks:
    name: Flatpak list
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate system-flatpaks.list against Flathub
        # Flatpaks install at first boot, so a wrong id cannot fail the build:
        # the machine just ships without that application. SDD §54 routes every
        # GUI app through this list, so that is most of the desktop.
        run: REPO="$GITHUB_WORKSPACE" bash build/validation/check-flatpaks.sh

      # draw.io is the one GUI app not delivered by Flathub (ADR 0016), so no
      # update mechanism reaches it — the pin is the only thing that moves it.
      # Warns rather than fails: upstream releases every few days.
      - name: Check the pinned draw.io release against upstream
        run: REPO="$GITHUB_WORKSPACE" bash build/validation/check-drawio.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lsagent:
    name: LsAgent pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # LsAgent is fetched at first boot, not at build time (ADR 0017), so a
      # withdrawn or replaced vendor build cannot fail the image build. It fails
      # on every laptop instead: the checksum guard refuses to install and the
      # step retries forever. A HEAD request here catches it in seconds.
      - name: Validate the pinned LsAgent build against the vendor
        run: REPO="$GITHUB_WORKSPACE" bash build/validation/check-lsagent.sh

  policy:
    name: SDD policy checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No secrets in the build context (Rule 13)
        run: |
          # config/company/vpn/certs/ is the one sanctioned location: the
          # ik-office VPN identity is committed on purpose (ADR 0018) because it
          # is already public, is one factor of two, and deferring it shipped
          # workstations with no VPN. The check still has to run everywhere else
          # -- a cosign key, a MOK key or a Lansweeper token reaching git would
          # be a real leak, and this is what catches it.
          #
          # No empty alternation branch: some greps (ugrep) reject `(A|B|)`.
          if grep -rlE 'BEGIN [A-Z0-9 ]*PRIVATE KEY' --exclude-dir=.git . \
               | grep -v '^\./config/company/vpn/certs/' | grep . ; then
            echo "::error::a private key is committed outside config/company/vpn/certs/."
            echo "Rule 13: secrets must not be embedded in the image. The ik-office"
            echo "VPN identity is the single documented exception (ADR 0018) and it"
            echo "does not generalise to any other credential."
            exit 1
          fi
          echo "no unexpected private keys found"

          # The exception is exactly four files. Anything else appearing there
          # would inherit the allowance above without ever being reviewed.
          unexpected=$(find config/company/vpn/certs -type f \
            ! -name 'ik-office-ca.pem' ! -name 'ik-office-cert.pem' \
            ! -name 'ik-office-key.pem' ! -name 'ik-office-tls-crypt.pem')
          if [[ -n "$unexpected" ]]; then
            echo "::error::unexpected files in config/company/vpn/certs/:"
            echo "$unexpected"
            exit 1
          fi

          # A committed certificate silently expiring is a fleet-wide VPN outage.
          if ! openssl x509 -in config/company/vpn/certs/ik-office-cert.pem \
                 -noout -checkend 2592000; then
            echo "::error::ik-office-cert.pem expires within 30 days ($(openssl x509 -in config/company/vpn/certs/ik-office-cert.pem -noout -enddate))."
            exit 1
          fi
          echo "VPN certificate valid: $(openssl x509 -in config/company/vpn/certs/ik-office-cert.pem -noout -enddate)"
      - name: No Fedora or NixOS base (Rules 1, 2)
        run: |
          if grep -nE '^FROM .*(fedora|centos|nixos|ubuntu)' Containerfile; then
            echo "::error::Rule 1 forbids a non-Debian base image."; exit 1
          fi
          if grep -rn 'rpm-ostree' --include='*.sh' build/ scripts/ ; then
            echo "::error::Rule 2 forbids rpm-ostree."; exit 1
          fi
          echo "base distribution policy satisfied"
      - name: Search Light is not reintroduced (Rule 7)
        run: |
          if grep -rn 'search-light' desktop/gnome/extensions/enabled.txt packages/; then
            echo "::error::Rule 7: ArcMenu replaces Search Light."; exit 1
          fi
          echo "Rule 7 satisfied"
      - name: Container signature policy
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo jq podman
          # As root, unlike locally. The probe reads containers-storage through
          # skopeo, which needs a user namespace, and Ubuntu 24.04 blocks
          # unprivileged userns creation (AppArmor). podman has a profile that
          # permits it and so builds the probe fine; skopeo does not, and fails
          # with "Error during unshare(...): Operation not permitted".
          # Root is not a workaround here so much as the honest environment:
          # `bootc install`, whose policy evaluation this reproduces, is root.
          sudo REPO="$GITHUB_WORKSPACE" ./build/validation/check-policy.sh

      - name: Justfile formatting
        run: |
          curl -sSfL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          just --unstable --fmt --check -f Justfile
