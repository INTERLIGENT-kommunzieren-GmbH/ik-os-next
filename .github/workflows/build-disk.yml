---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [testing, stable]
        default: testing
      upload-to-s3:
        type: boolean
        default: false
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ik-os-next
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CHANNEL: ${{ inputs.channel || 'testing' }}
  # Virtual size of the disk image. The file is sparse, so this costs only what
  # is actually written; it is a ceiling, not an allocation.
  #
  # 32G matches the Justfile's build-raw/build-qcow2 default. The installed
  # image is ~7 GB and first boot then pulls roughly
  # 12 GB of Flatpaks and runtimes into /var/lib/flatpak — the figure
  # build/validation/check-flatpaks.sh prints on every run. A 20G disk boots and
  # then runs out of space during ik-os-firstboot, which is a far more expensive
  # failure to diagnose than an oversized sparse file.
  DISK_SIZE: 32G

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disk:
    name: ${{ matrix.type }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        type: [raw, qcow2]

    steps:
      - uses: actions/checkout@v5

      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Install qemu-img
        run: sudo apt-get update && sudo apt-get install -y qemu-utils

      - name: Pull the image
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          sudo podman pull "${IMAGE_REGISTRY,,}/${IMAGE_NAME}:${CHANNEL}"

      # bootc installs itself. bootc-image-builder is not used: it is an
      # RPM-oriented tool and its ISO path cannot build a Debian installer
      # (docs/adr/0003-installer-iso.md).
      #
      # The backend and bootloader flags come from build/lib/bootc-install-flags.sh,
      # the same file the Justfile recipe sources. This step used to hardcode the
      # invocation without them, so it silently used bootc's default ostree
      # backend and died on "bootupd is required for ostree-based installs" — the
      # exact failure ADR 0005 was written to avoid. It went unnoticed because the
      # workflow only runs after a successful "Build image", which had never
      # happened.
      - name: Install to disk
        run: |
          mkdir -p output

          # shellcheck disable=SC1091
          REPO="$GITHUB_WORKSPACE" . build/lib/bootc-install-flags.sh
          echo "install flags: ${INSTALL_FLAGS[*]}"
          PODMAN="sudo podman" bootc_require_oci_manifest \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${CHANNEL}"

          # --via-loopback attaches a loop device to an EXISTING file; bootc does
          # not create one. Without this truncate the run dies on
          #   error: Installing to disk: Querying /output/ik-os.raw:
          #   No such file or directory (os error 2)
          # which reads like a missing output rather than a missing input.
          truncate -s "$DISK_SIZE" output/ik-os.raw
          ls -l output/ik-os.raw

          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v /dev:/dev \
            -v "$PWD/output:/output" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${CHANNEL}" \
            bootc install to-disk --via-loopback --wipe \
              --filesystem btrfs "${INSTALL_FLAGS[@]}" /output/ik-os.raw
          sudo chown "$USER:$USER" output/ik-os.raw

          # Apparent size is DISK_SIZE; the number that matters is what was
          # actually written. Logged so a disk sized too small for the image, or
          # an install that silently wrote nothing, is visible here.
          echo "apparent: $(du -h --apparent-size output/ik-os.raw | cut -f1)"
          echo "on disk : $(du -h output/ik-os.raw | cut -f1)"
          [[ -s output/ik-os.raw ]] || { echo "::error::the disk image is empty"; exit 1; }

      - name: Convert to qcow2
        if: matrix.type == 'qcow2'
        run: |
          qemu-img convert -f raw -O qcow2 -c output/ik-os.raw output/ik-os.qcow2
          rm -f output/ik-os.raw

      - name: Checksum
        run: cd output && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Upload artefact
        if: inputs.upload-to-s3 != true
        uses: actions/upload-artifact@v7
        with:
          name: ik-os-${{ env.CHANNEL }}-${{ matrix.type }}
          path: output/
          if-no-files-found: error
          # The qcow2 is already compressed by `qemu-img convert -c`, so
          # recompressing it is wasted CPU. The raw image is the opposite case:
          # a 30G sparse file whose holes upload as zeros, so leaving it
          # uncompressed would push tens of gigabytes for a ~7 GB payload.
          compression-level: ${{ matrix.type == 'raw' && 6 || 0 }}

      - name: Upload to S3
        if: inputs.upload-to-s3 == true
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          sudo apt-get install -y rclone
          rclone copy output "S3:${{ secrets.S3_BUCKET_NAME }}/${CHANNEL}/"
