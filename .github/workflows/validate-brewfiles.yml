name: Validate Brewfiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom/brew/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9e4e8a51a9c176b4a09af62456857a06d260a80b # master

      - name: Validate Brewfiles
        shell: bash
        run: |
          echo "Validating Brewfiles in custom/brew/ directory..."

          # Verify each referenced formula/cask EXISTS on Homebrew.
          # We intentionally do not use `brew bundle check`, which verifies
          # packages are *installed* — CI runners start with nothing installed,
          # so that would fail for any real entry. Existence is what we can check.
          rc=0
          while IFS= read -r -d '' brewfile ; do
            echo "::group:: ===$(basename "$brewfile")==="
            while IFS= read -r pkg ; do
              [ -z "$pkg" ] && continue
              if brew info "$pkg" >/dev/null 2>&1 ; then
                echo "✓ $pkg exists"
              else
                echo "✗ $pkg not found on Homebrew"
                rc=1
              fi
            done < <(grep -oE '^[[:space:]]*(brew|cask)[[:space:]]+"[^"]+"' "$brewfile" | sed -E 's/.*"([^"]+)".*/\1/')
            echo "::endgroup::"
          done < <(find "custom/brew" -iname '*.Brewfile*' -print0)

          exit "$rc"
