---
name: Build image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    # Weekly rebuild picks up Debian security updates (SDD §50).
    - cron: "0 3 * * 3"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to publish"
        type: choice
        options: [testing, stable]
        default: testing

env:
  IMAGE_NAME: ik-os-next
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CHANNEL: ${{ inputs.channel || 'testing' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      # Before the build, not after: the image embeds config/company/cosign.pub
      # and refuses anything not signed by its pair (SDD §45). If the two have
      # drifted, every machine rejects the image — and finding that out after a
      # 90-minute build and a push is finding it out too late. The private key is
      # write-only once set, so deriving the public key from it is the only way to
      # know the two still match.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: The signing key must match the public key in the image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [[ -z "$COSIGN_PRIVATE_KEY" ]]; then
            echo "::error::SIGNING_SECRET is not set. The build would push an"
            echo "unsigned image that every machine then refuses (SDD §45)."
            exit 1
          fi
          COSIGN_PASSWORD="" cosign public-key --key env://COSIGN_PRIVATE_KEY \
            > /tmp/from-secret.pub
          if ! diff -u config/company/cosign.pub /tmp/from-secret.pub; then
            echo "::error::SIGNING_SECRET does not match config/company/cosign.pub."
            echo "The image would trust one key and be signed with another."
            echo "Rotate both together — see docs/releases.md."
            exit 1
          fi
          echo "signing key matches the public key shipped in the image"

      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Prepare
        id: meta
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${CHANNEL}.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # SDD §5 — the testing and stable channels must Secure Boot, so the build
      # is told to fail if the signing key is missing (Rule 18).
      - name: Stage the Secure Boot signing key
        if: github.event_name != 'pull_request' && env.MOK_KEY != ''
        env:
          MOK_KEY: ${{ secrets.SECURE_BOOT_MOK_KEY }}
          MOK_CRT: ${{ secrets.SECURE_BOOT_MOK_CERT }}
        run: |
          mkdir -p secrets
          printf '%s' "$MOK_KEY" > secrets/ik-os-mok.key
          printf '%s' "$MOK_CRT" > secrets/ik-os-mok.crt
          chmod 600 secrets/ik-os-mok.key
          sed -i 's/^SECURE_BOOT_SIGNING=.*/SECURE_BOOT_SIGNING=required/' \
            config/boot/secure-boot.env
          sed -i 's|^SECURE_BOOT_KEY=.*|SECURE_BOOT_KEY=/ctx/secrets/ik-os-mok.key|' \
            config/boot/secure-boot.env
          sed -i 's|^SECURE_BOOT_CERT=.*|SECURE_BOOT_CERT=/ctx/secrets/ik-os-mok.crt|' \
            config/boot/secure-boot.env

      - name: Build image
        id: build
        run: |
          podman build \
            --build-arg "IK_OS_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "IK_OS_BUILD_ID=${GITHUB_RUN_ID}" \
            --build-arg "IK_OS_CHANNEL=${CHANNEL}" \
            --build-arg "SHA_HEAD_SHORT=$(git rev-parse --short HEAD)" \
            --tag "${IMAGE_NAME}:${CHANNEL}" \
            .
          rm -rf secrets

      - name: Record the release manifest
        run: |
          podman run --rm "${IMAGE_NAME}:${CHANNEL}" \
            cat /usr/share/ik-os/release.env | tee release.env
          podman run --rm "${IMAGE_NAME}:${CHANNEL}" \
            cat /usr/share/ik-os/packages.manifest > packages.manifest
          wc -l packages.manifest

      # SDD §46 — every release ships an SBOM.
      # syft cannot read podman's local storage. Its podman provider talks to the
      # podman API socket, which a GitHub runner does not have, so a bare
      # `ik-os:testing` falls through every other provider and ends up asking
      # Docker Hub for library/ik-os. Export the image and scan the archive
      # instead: no daemon, no registry, no credentials.
      - name: Install syft
        run: |
          # Downloaded then run, not piped into sh: a pipeline hides curl's exit
          # status (the same reason the Containerfile does this for rustup).
          curl --proto '=https' --tlsv1.2 -sSfo /tmp/syft.sh https://get.anchore.io/syft
          sudo sh /tmp/syft.sh -b /usr/local/bin
          rm -f /tmp/syft.sh
          syft --version

      - name: Generate SBOM
        run: |
          echo "disk before export:"; df -h / | tail -1
          podman save --format oci-archive \
            -o "${RUNNER_TEMP}/ik-os.oci" "${IMAGE_NAME}:${CHANNEL}"
          ls -lh "${RUNNER_TEMP}/ik-os.oci"
          echo "disk after export:"; df -h / | tail -1
          syft scan "oci-archive:${RUNNER_TEMP}/ik-os.oci" -o spdx-json > ik-os.spdx.json
          # Reclaimed before the push, which needs the room more than this does.
          rm -f "${RUNNER_TEMP}/ik-os.oci"
          test -s ik-os.spdx.json
          # jq, not grep: "SPDXRef-Package" also appears in every relationship
          # entry, which overcounts by ~60x (5014 vs 85 on a test image).
          echo "SBOM: $(wc -c < ik-os.spdx.json) bytes, $(jq '.packages | length' ik-os.spdx.json) packages"
          echo "disk after cleanup:"; df -h / | tail -1

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: ik-os-metadata-${{ env.CHANNEL }}
          path: |
            release.env
            packages.manifest
            ik-os.spdx.json

      # GITHUB_TOKEN is the intended credential. It was refused at first because
      # the ik-os-next package already existed — an orphan from the Fedora-44
      # daily lineage — and a package that a push does not create grants nothing
      # implicitly. The fix was on the package, not here: Manage Actions access
      # now lists this repository with the Admin role (docs/releases.md).
      #
      # GHCR_TOKEN (a PAT) is still preferred when set, so a lost grant can be
      # worked around without editing a workflow. Leave it unset. The credential
      # actually used is logged, so if the ACL ever disappears the failure names
      # what was tried instead of looking like a workflow regression.
      #
      # --password-stdin, not -p: the latter puts the credential in the process
      # list of a machine running other people's code.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$GHCR_TOKEN" ]]; then
            echo "authenticating with GHCR_TOKEN (PAT)"
            token="$GHCR_TOKEN"
          else
            echo "authenticating with GITHUB_TOKEN (no PAT configured)"
            token="$GITHUB_TOKEN"
          fi

          # One credential file, shared by both tools, because they disagree about
          # where it lives: podman reads REGISTRY_AUTH_FILE, while cosign uses
          # go-containerregistry and reads $DOCKER_CONFIG/config.json. Leave them
          # to their defaults and `podman push` succeeds while `cosign sign` fails
          # with UNAUTHORIZED on the same registry in the same job — which is
          # exactly what happened on the first successful push. The formats are
          # compatible, so one file serves both.
          auth="${RUNNER_TEMP}/docker"
          mkdir -p "$auth"
          echo "DOCKER_CONFIG=${auth}"                >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=${auth}/config.json" >> "$GITHUB_ENV"

          printf '%s' "$token" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
                --authfile "${auth}/config.json"

          # Prove the file cosign will read actually carries the entry, here
          # rather than after a 20-minute build and a completed push.
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); \
            sys.exit(0 if 'ghcr.io' in d.get('auths',{}) else 1)" \
            "${auth}/config.json" \
            || { echo "podman login wrote no ghcr.io entry to ${auth}/config.json"; exit 1; }
          echo "credentials written to ${auth}/config.json for both podman and cosign"

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for tag in "${CHANNEL}" "${{ steps.meta.outputs.version }}"; do
            podman push "${IMAGE_NAME}:${CHANNEL}" "docker://${IMAGE}:${tag}"
          done
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${CHANNEL}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}"

      # SDD §45 — production images are signed, and signing uses a CI-held key,
      # never a developer workstation. cosign is installed at the top of the job,
      # where the key is checked against the one the image embeds.
      # Both steps retry the whole cosign invocation, not just its HTTP calls,
      # because a registry push can genuinely be flaky and cosign's own retry
      # only covers a single request.
      #
      # The signature goes to the transparency log; the SBOM attestation does
      # not. See the attest step for why — it is not a preference.
      - name: Sign the image by digest
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          for attempt in 1 2 3; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" && exit 0
            echo "::warning::cosign sign failed (attempt ${attempt}/3), retrying"
            sleep $(( attempt * 20 ))
          done
          echo "::error::cosign sign failed three times — refusing to ship an unsigned image (Rule 18)"
          exit 1

      # --tlog-upload=false, for two independent reasons.
      #
      # 1. It cannot work. The SBOM is ~49 MiB (5,381 packages, but also 51,091
      #    catalogued files and 70,895 relationships), and cosign base64-encodes
      #    the DSSE envelope into the request body. rekor.sigstore.dev refuses an
      #    entry that size, deterministically — this failed three identical
      #    retries on 2026-08-31 while `cosign sign`, whose payload is a few
      #    hundred bytes, succeeded in the same job minutes earlier. It was never
      #    a transient outage.
      # 2. It should not work. The transparency log is public and immutable.
      #    Uploading this SBOM publishes the exact package-and-version inventory
      #    of every company machine, permanently and unremovably. That is a
      #    disclosure decision, and nobody made it.
      #
      # The attestation is still attached to the image in the registry, which is
      # where anything would look for it. Nothing in this repository verifies it
      # today; whatever does must pass --insecure-ignore-tlog, because there is
      # deliberately no log entry to find.
      - name: Attach the SBOM to the image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          ls -l ik-os.spdx.json
          for attempt in 1 2 3; do
            cosign attest -y --tlog-upload=false \
              --predicate ik-os.spdx.json --type spdxjson \
              --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" && exit 0
            echo "::warning::cosign attest failed (attempt ${attempt}/3), retrying"
            sleep $(( attempt * 20 ))
          done
          echo "::error::cosign attest failed three times — the image is signed but has no SBOM attestation"
          exit 1
